services:
  nginx:
    image: nginx:alpine
    container_name: jo4-nginx
    restart: always
    ports:
      - "80:80"
      - "6010:6010"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/upstream.inc:/etc/nginx/conf.d/upstream.inc:rw
    networks:
      jo4-net:
      tunnel-net:
        aliases:
          - jo4-site

  web-blue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jo4-web-blue
    restart: always
    ports:
      - "127.0.0.1:5001:5000"
    env_file:
      - .env
    environment:
      - PORT=5000
      - ENV=production
      - DATABASE_URL=/app/data/jo4dev.db
    volumes:
      - db_data:/app/data
      - static_uploads:/app/static/uploads
    networks:
      - jo4-net

  web-green:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jo4-web-green
    restart: always
    ports:
      - "127.0.0.1:5002:5000"
    env_file:
      - .env
    environment:
      - PORT=5000
      - ENV=production
      - DATABASE_URL=/app/data/jo4dev.db
    volumes:
      - db_data:/app/data
      - static_uploads:/app/static/uploads
    networks:
      - jo4-net

networks:
  jo4-net:
    driver: bridge
  tunnel-net:
    external: true

volumes:
  db_data:
  static_uploads:
